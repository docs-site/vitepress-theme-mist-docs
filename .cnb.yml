# .cnb.yml
$:
  vscode:
    - docker:
        # 指定开发环境镜像，可以是任意可访问的镜像。
        # 如果 image 指定的镜像中已安装 code-server 代码服务，将使用单容器模式启动开发环境
        # 如果 image 指定的镜像中未安装 code-server 代码服务，将使用双容器模式启动开发环境
        # 如下镜像为 CNB 默认开发环境镜像，已安装代码服务，将使用单容器模式启动开发环境
        # 可按需替换为其他镜像
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker
      # 开发环境启动后会执行的任务
      stages:
        - name: 查看当前路径下文件
          script:
            - echo "当前路径为 $(pwd)"
            - ls -al

main:
  push:
    - stages:
        # 本文件会随模板仓库分发到用户生成的仓库，同步任务仅允许模板仓库本身执行：
        # 通过内置变量 CNB_REPO_SLUG_LOWERCASE（格式：群组/仓库）精确匹配，派生仓库自动跳过
        - name: sync to sumumm'github
          if: test "$CNB_REPO_SLUG_LOWERCASE" = "sumu.m/vitepress-theme-mist-docs"
          image: tencentcom/git-sync
          imports: https://cnb.cool/sumu.k/secret-key/-/blob/main/access-token.yml
          settings:
            target_url: https://github.com/docs-site/vitepress-theme-mist-docs.git
            auth_type: https
            username: sumumm
            password: ${GITHUB_CNB_SYNC}
            force: true
        - name: sync to sumumm'gitee
          if: test "$CNB_REPO_SLUG_LOWERCASE" = "sumu.m/vitepress-theme-mist-docs"
          image: tencentcom/git-sync
          imports: https://cnb.cool/sumu.k/secret-key/-/blob/main/access-token.yml
          settings:
            target_url: https://gitee.com/docs-site/vitepress-theme-mist-docs.git
            auth_type: https
            username: sumumm
            password: ${GITEE_CNB_SYNC}
            force: true
