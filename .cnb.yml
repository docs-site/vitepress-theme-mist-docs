# .cnb.yml
#
# 流水线已按用途拆分到 .cnb/workflows/ 目录：
#   - sync-repo.yml        代码同步（仅模板仓库自身执行）
#   - deploy-gh-pages.yml  部署到 GitHub Pages（随模板分发，所有仓库触发）
#
# 注意：CNB 不会自动加载 .cnb/workflows/ 下的文件（该目录名是 GitHub Actions 的约定），
# 必须在此处显式 include，路径相对于仓库根目录。
include:
  - .cnb/workflows/sync-repo.yml
  - .cnb/workflows/deploy-gh-pages.yml

$:
  vscode:
    - docker:
        # 指定开发环境镜像，可以是任意可访问的镜像。
        # 如果 image 指定的镜像中已安装 code-server 代码服务，将使用单容器模式启动开发环境
        # 如果 image 指定的镜像中未安装 code-server 代码服务，将使用双容器模式启动开发环境
        # 如下镜像为 CNB 默认开发环境镜像，已安装代码服务，将使用单容器模式启动开发环境
        # 可按需替换为其他镜像
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker
      # 开发环境启动后会执行的任务
      stages:
        - name: 查看当前路径下文件
          script:
            - echo "当前路径为 $(pwd)"
            - ls -al
