# 代码同步流水线：将本仓库代码同步到 GitHub / Gitee 镜像仓库
#
# 本文件会随模板仓库分发到用户生成的仓库，因此同步任务仅允许模板仓库本身执行：
# 通过内置变量 CNB_REPO_SLUG_LOWERCASE（格式：群组/仓库）精确匹配，派生仓库自动跳过。
main:
  push:
    - name: 同步代码到镜像仓库
      stages:
        - name: sync to sumumm'github
          if: test "$CNB_REPO_SLUG_LOWERCASE" = "sumu.m/vitepress-theme-mist-docs"
          image: tencentcom/git-sync
          imports: https://cnb.cool/sumu.k/secret-key/-/blob/main/access-token.yml
          settings:
            target_url: https://github.com/docs-site/vitepress-theme-mist-docs.git
            auth_type: https
            username: sumumm
            password: ${GITHUB_CNB_SYNC}
            force: true
        - name: sync to sumumm'gitee
          if: test "$CNB_REPO_SLUG_LOWERCASE" = "sumu.m/vitepress-theme-mist-docs"
          image: tencentcom/git-sync
          imports: https://cnb.cool/sumu.k/secret-key/-/blob/main/access-token.yml
          settings:
            target_url: https://gitee.com/docs-site/vitepress-theme-mist-docs.git
            auth_type: https
            username: sumumm
            password: ${GITEE_CNB_SYNC}
            force: true
